<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyTime 任务计时器</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- 顶部标题栏 -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>MyTime 任务计时器</h1>
      </div>
      <button id="addBtn" class="btn btn-primary">
        <span class="plus">+</span> 添加任务
      </button>
    </header>

    <!-- 任务列表卡片 -->
    <section class="card">
      <div class="table-wrap">
        <table class="task-table">
          <thead>
            <tr>
              <th class="col-drag"></th>
              <th class="col-index">#</th>
              <th class="col-name">任务名称</th>
              <th class="col-time">任务时间</th>
              <th class="col-timer">计时器</th>
              <th class="col-ops">操作</th>
            </tr>
          </thead>
          <tbody id="taskList"></tbody>
        </table>
        <div id="emptyState" class="empty-state" hidden>
          <div class="empty-icon">🗓️</div>
          <p>还没有任务，点击右上角「添加任务」开始吧</p>
        </div>
      </div>
    </section>

    <footer class="footer">数据保存在本地浏览器 · 刷新不丢失</footer>
  </div>

  <!-- 添加 / 修改 弹窗 -->
  <div id="modal" class="modal" hidden>
    <div class="modal-overlay" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modalTitle">添加任务</h2>
        <button class="modal-close" data-close aria-label="关闭">×</button>
      </div>

      <form id="taskForm" class="modal-body">
        <label class="field">
          <span class="field-label">任务名称</span>
          <input type="text" id="nameInput" class="input" placeholder="例如：项目交付" required maxlength="60" />
        </label>

        <div class="field">
          <span class="field-label">任务类型</span>
          <div class="seg" id="typeSeg">
            <button type="button" class="seg-item is-active" data-type="countdown">倒计时</button>
            <button type="button" class="seg-item" data-type="birthday">纪念日</button>
            <button type="button" class="seg-item" data-type="memorial">倒数日</button>
          </div>
          <p id="typeLockTip" class="type-lock-tip" hidden>修改模式下任务类型已锁定，如需变更请删除后重新添加</p>
        </div>

        <!-- 倒计时类型输入区 -->
        <div class="field type-panel" id="countdownField" hidden>
          <span class="field-label">倒计时设置</span>
          <div class="countdown-row">
            <input type="number" id="cdValueInput" class="input cd-value" min="1" step="1" value="1" placeholder="数值" />
            <div class="seg seg-unit" id="unitSeg">
              <button type="button" class="seg-item is-active" data-unit="year">年</button>
              <button type="button" class="seg-item" data-unit="month">月</button>
              <button type="button" class="seg-item" data-unit="week">周</button>
              <button type="button" class="seg-item" data-unit="day">天</button>
              <button type="button" class="seg-item" data-unit="hour">时</button>
              <button type="button" class="seg-item" data-unit="minute">分</button>
            </div>
          </div>
        </div>

        <!-- 纪念日类型输入区 -->
        <div class="field type-panel" id="birthdayField" hidden>
          <span class="field-label">出生日期</span>
          <input type="date" id="birthdayInput" class="input" />
        </div>

        <!-- 纪念类型输入区 -->
        <div class="field type-panel" id="memorialField" hidden>
          <span class="field-label">目标日期</span>
          <input type="date" id="memorialInput" class="input" />
        </div>

        <div class="modal-foot">
          <button type="button" class="btn btn-ghost" data-close>取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
