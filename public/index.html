<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%97%3C/text%3E%3C/svg%3E" />
  <title>MyTime 任务计时器</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    // 提前应用主题，避免暗色下刷新白闪
    (function () {
      try {
        var t = localStorage.getItem("mytime_theme");
        if (!t) t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app">
    <!-- 顶部标题栏 -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>MyTime</h1>
      </div>
      <div class="top-actions">
        <button id="themeBtn" class="btn btn-ghost" type="button" title="切换主题" aria-label="切换主题">
          <span id="themeIcon">🌙</span>
        </button>
        <button id="addBtn" class="btn btn-primary">
          <span class="plus">+</span> 任务
        </button>
        <button id="dataBtn" class="btn btn-ghost" type="button" title="数据管理">
          <span class="db-icon">🗄️</span> 数据
        </button>
      </div>
    </header>

    <!-- 顶部信息容器：每日一言（仅在桌面端显示，手机端隐藏） -->
    <section class="infobar infobar--desktop" aria-label="每日一言">
      <!-- 每日一言 -->
      <div class="daily-quote" id="dailyQuote">
        <span class="dq-text" id="dqText"></span>
        <span class="dq-from" id="dqFrom"></span>
      </div>
    </section>

    <!-- 任务列表卡片 -->
    <section class="card task-card">
      <div class="table-wrap preload">
        <table class="task-table">
          <thead>
            <tr>
              <th class="col-drag"></th>
              <th class="col-index">#</th>
              <th class="col-name">任务名称</th>
              <th class="col-time">任务时间</th>
              <th class="col-timer">计时器</th>
              <th class="col-ops">操作</th>
            </tr>
          </thead>
          <tbody id="taskList"></tbody>
        </table>
        <div id="emptyState" class="empty-state" hidden>
          <div class="empty-icon">🗓️</div>
          <p>还没有任务，点击右上角「添加任务」开始吧</p>
        </div>
      </div>
    </section>

    <footer class="footer">数据保存在本地浏览器 · 刷新不丢失</footer>
  </div>

  <!-- 独立小日历控件：今日信息（可拖动，位置持久化到本地） -->
  <aside id="miniCalendar" class="mini-calendar" aria-label="今日信息">
    <div class="mini-calendar__handle" title="拖动移动位置">
      <span class="mini-calendar__title" id="mcHandleTitle">今日信息</span>
      <button type="button" class="mc-toggle" id="mcToggleAll" aria-label="展开/折叠今日信息">−</button>
    </div>
    <div class="mini-calendar__body" id="mcBody">
      <div class="mc-date-line" id="mcDateLine"></div>
      <div class="mc-pills" id="mcPills">
        <span class="mc-pill mc-pill--week" id="mcWeek"></span>
        <span class="mc-pill mc-pill--holiday" id="mcHoliday"><span class="mc-holiday__dot"></span><span class="mc-holiday__label">工作</span></span>
        <span class="mc-pill mc-pill--xz" id="mcXz"></span>
      </div>
      <div class="mc-lunar-row">
        <div class="mc-lunar" id="mcLunar"></div>
        <button type="button" class="mc-toggle" id="mcToggleLunar" aria-label="展开/折叠农历详情">+</button>
      </div>
      <div class="mc-lunar-detail" id="mcLunarDetail">
        <div class="mc-divider"></div>
        <div class="mc-detail-block" id="mcMeta"></div>
        <div class="mc-divider"></div>
        <div class="mc-detail-block mc-almanac" id="mcAlmanac"></div>
        <div class="mc-divider"></div>
        <div class="mc-detail-block mc-pengzu" id="mcPengzu"></div>
        <div class="mc-divider"></div>
        <div class="mc-detail-block mc-jixiong" id="mcJiXiong"></div>
        <div class="mc-divider"></div>
        <div class="mc-detail-block mc-sha" id="mcSha"></div>
        <div class="mc-divider"></div>
        <div class="mc-detail-block mc-position" id="mcPosition"></div>
      </div>
      <div class="mc-events" id="mcEvents">
        <span class="mc-tag">节日节气</span>
        <div class="mc-events__list" id="mcEventsList"></div>
      </div>
    </div>
  </aside>

  <!-- 添加 / 修改 弹窗 -->
  <div id="modal" class="modal" hidden>
    <div class="modal-overlay"></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modalTitle">添加任务</h2>
        <button class="modal-close" data-close aria-label="关闭">×</button>
      </div>

      <form id="taskForm" class="modal-body">
        <label class="field">
          <span class="field-label">任务名称</span>
          <input type="text" id="nameInput" class="input" placeholder="例如：项目交付" required maxlength="60" />
        </label>

        <div class="field">
          <span class="field-label">任务类型</span>
          <div class="seg" id="typeSeg">
            <button type="button" class="seg-item is-active" data-type="countdown">倒计时</button>
            <button type="button" class="seg-item" data-type="birthday">纪念日</button>
            <button type="button" class="seg-item" data-type="memorial">倒数日</button>
            <button type="button" class="seg-item" data-type="fixedday">固定日</button>
            <button type="button" class="seg-item" data-type="cron">Cron</button>
          </div>
          <p id="typeLockTip" class="type-lock-tip" hidden>修改模式下任务类型已锁定，如需变更请删除后重新添加</p>
        </div>

        <!-- 倒计时类型输入区 -->
        <div class="field type-panel" id="countdownField" hidden>
          <div class="field-label-row">
            <span class="field-label">设置倒计时</span>
            <div class="seg calendar-seg anchor-seg" id="anchorSegCountdown">
              <button type="button" class="seg-item is-active" data-anchor="now">此刻</button>
              <button type="button" class="seg-item" data-anchor="anchored">锚定</button>
            </div>
          </div>
          <div class="countdown-row">
            <input type="number" id="cdValueInput" class="input cd-value" min="1" step="1" value="1" placeholder="数值" />
            <div class="seg seg-unit" id="unitSeg">
              <button type="button" class="seg-item is-active" data-unit="year">年</button>
              <button type="button" class="seg-item" data-unit="month">月</button>
              <button type="button" class="seg-item" data-unit="week">周</button>
              <button type="button" class="seg-item" data-unit="day">天</button>
              <button type="button" class="seg-item" data-unit="hour">时</button>
              <button type="button" class="seg-item" data-unit="minute">分</button>
            </div>
          </div>
          <div class="anchor-datetime" id="anchorDatetimeCountdown" hidden>
            <span class="field-label anchor-datetime-label">起始时刻</span>
            <div class="anchor-datetime-controls">
              <input type="date" id="anchorDateCountdown" class="input anchor-date" />
              <input type="time" id="anchorTimeCountdown" class="input anchor-time" step="1" />
            </div>
          </div>
        </div>

        <!-- 纪念日类型输入区 -->
        <div class="field type-panel" id="birthdayField" hidden>
          <div class="field-label-row">
            <span class="field-label">设置纪念日期</span>
            <div class="seg calendar-seg" id="birthdayCalendarToggle">
              <button type="button" class="seg-item is-active" data-cal="solar">公历</button>
              <button type="button" class="seg-item" data-cal="lunar">农历</button>
            </div>
          </div>
          <input type="date" id="birthdayInput" class="input" />
          <div class="lunar-picker" id="birthdayLunarPicker" hidden>
            <div class="lunar-row">
              <select class="input lunar-select lunar-year" id="birthdayLunarYear"></select>
              <select class="input lunar-select" id="birthdayLunarMonth"></select>
              <select class="input lunar-select lunar-day" id="birthdayLunarDay"></select>
              <button type="button" class="leap-btn" id="birthdayLunarLeap">闰月</button>
            </div>
          </div>
        </div>

        <!-- 倒数日类型输入区 -->
        <div class="field type-panel" id="memorialField" hidden>
          <div class="field-label-row">
            <span class="field-label">设置目标日期</span>
            <div class="seg calendar-seg" id="memorialCalendarToggle">
              <button type="button" class="seg-item is-active" data-cal="solar">公历</button>
              <button type="button" class="seg-item" data-cal="lunar">农历</button>
            </div>
          </div>
          <input type="date" id="memorialInput" class="input" />
          <div class="lunar-picker" id="memorialLunarPicker" hidden>
            <div class="lunar-row">
              <select class="input lunar-select lunar-year" id="memorialLunarYear"></select>
              <select class="input lunar-select" id="memorialLunarMonth"></select>
              <select class="input lunar-select lunar-day" id="memorialLunarDay"></select>
              <button type="button" class="leap-btn" id="memorialLunarLeap">闰月</button>
            </div>
          </div>
        </div>

        <!-- 固定日类型输入区 -->
        <div class="field type-panel" id="fixeddayField" hidden>
          <span class="field-label">固定日多个日子用/分割，支持 1-28、-3、-2、-1</span>
          <input type="text" id="fixeddayInput" class="input fixedday-value" value="1" placeholder="例如：1/15/-1" />
        </div>

        <!-- Cron 类型输入区 -->
        <div class="field type-panel" id="cronField" hidden>
          <div class="field-label-row">
            <span class="field-label">Cron 表达式（分 时 日 月 周）</span>
            <div class="seg calendar-seg anchor-seg" id="anchorSegCron">
              <button type="button" class="seg-item is-active" data-anchor="now">此刻</button>
              <button type="button" class="seg-item" data-anchor="anchored">锚定</button>
            </div>
          </div>
          <input type="text" id="cronInput" class="input cron-value" value="0 8 * * *" placeholder="例：0 8 * * *（每天早上8点）" />
          <div class="anchor-datetime" id="anchorDatetimeCron" hidden>
            <span class="field-label anchor-datetime-label">起始时刻</span>
            <div class="anchor-datetime-controls">
              <input type="date" id="anchorDateCron" class="input anchor-date" />
              <input type="time" id="anchorTimeCron" class="input anchor-time" step="1" />
            </div>
          </div>
          <div id="cronInfo" class="cron-info" hidden></div>
        </div>

        <div class="modal-foot">
          <button type="button" class="btn btn-ghost" data-close>取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 数据管理弹窗 -->
  <div id="dataModal" class="modal" hidden>
    <div class="modal-overlay"></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2>数据管理</h2>
        <button class="modal-close" data-close="data" aria-label="关闭">×</button>
      </div>

      <div class="modal-body">
        <p class="data-hint">当前本地共 <span id="dataCount">0</span> 条数据</p>

        <div class="field">
          <span class="field-label">导出</span>
          <button id="exportBtn" class="btn btn-primary" type="button">导出JSON文件</button>
        </div>

        <div class="field">
          <span class="field-label">导入（将覆盖当前全部数据）</span>
          <div class="import-row">
            <input type="file" id="importInput" accept="application/json,.json" class="input" hidden />
            <button id="importPickBtn" class="btn btn-ghost" type="button">选择文件</button>
            <span id="importFileName" class="import-file-name"></span>
          </div>
          <button id="importBtn" class="btn btn-primary" type="button">导入并覆盖</button>
        </div>

        <p id="dataMsg" class="data-msg" hidden></p>
      </div>
    </div>
  </div>

  <script src="vendor/croner.umd.min.js" defer></script>
  <script src="vendor/lunar.js" defer></script>
  <script src="vendor/holidays.js" defer></script>
  <!-- 移动端长按任务卡片弹出的底部操作栏 -->
  <div class="action-sheet__overlay" id="actionSheetOverlay"></div>
  <div class="action-sheet" id="actionSheet" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="action-sheet__title" id="actionSheetTitle"></div>
    <button type="button" class="action-sheet__btn action-sheet__btn--edit" id="actionEditBtn">修改</button>
    <button type="button" class="action-sheet__btn action-sheet__btn--del" id="actionDelBtn">删除</button>
    <button type="button" class="action-sheet__btn action-sheet__btn--cancel" id="actionCancelBtn">取消</button>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
